<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Date #1</title>
    <meta name="theme-color" content="#0a0a0a">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .wrapper {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
            background: #0a0a0a;
            position: relative;
        }

        /* Главное фото */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: #111;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.4) 50%, transparent 100%);
            pointer-events: none;
        }

        .name {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            z-index: 2;
        }

        /* ===== Круглые кнопки сверху ===== */
        .top-buttons {
            position: absolute;
            top: 18px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .circle-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00aff0;
            box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            text-decoration: none;
            transition: transform 0.15s ease;
            animation: pulseCircle 2s infinite;
        }

        .circle-btn.tg {
            background: #2AABEE;
            box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            animation: pulseCircleTg 2s infinite;
        }

        .circle-btn:active {
            transform: scale(0.92);
        }

        .circle-btn svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        @keyframes pulseCircle {
            0% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 8px 28px rgba(0, 175, 240, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            }
        }

        @keyframes pulseCircleTg {
            0% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 8px 28px rgba(42, 171, 238, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            }
        }

        /* Баннеры */
        .banner-block {
            padding: 16px 16px 30px;
        }

        .banner {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #111;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            margin-bottom: 16px;
        }

        .banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .banner-btn {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }

        .banner-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .banner-btn:active {
            transform: scale(0.97);
        }

        .btn-18 {
            background: linear-gradient(135deg, #00aff0, #0088cc);
            box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            animation: pulse18 2s infinite;
        }

        .btn-tg {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            animation: pulseTg 2s infinite;
        }

        .banner-btn svg {
            width: 22px;
            height: 22px;
        }

        @keyframes pulse18 {
            0% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 8px 28px rgba(0, 175, 240, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(0, 175, 240, 0.45);
            }
        }

        @keyframes pulseTg {
            0% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 8px 28px rgba(42, 171, 238, 0.7);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
            }
        }

        @media (max-height: 700px) {
            .hero {
                aspect-ratio: 3/3.5;
            }
            .name {
                font-size: 28px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Главное фото -->
        <div class="hero">
            <img src="https://i.postimg.cc/4nCxRnGV/6558a2555c57dcee976c14f4621a97d3.jpg" alt="Private Date #1">
            <div class="hero-overlay"></div>
            <div class="name">Private Date #1</div>

            <!-- Круглые кнопки сверху -->
            <div class="top-buttons">
                <!-- SMS кнопка -->
                <a href="https://kuni.mom" class="circle-btn" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/>
                    </svg>
                </a>

                <!-- Telegram кнопка -->
                <a href="https://t.me/+gDTbMlMhkL1kMDVi" class="circle-btn tg" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- Баннеры -->
        <div class="banner-block">
            
            <!-- Баннер 18+ -->
            <div class="banner">
                <img src="https://i.postimg.cc/SR08PCmP/video-2026-07-17-15-53-33-2.gif" alt="18+">
                <a href="https://kuni.mom" class="banner-btn btn-18" id="btn18" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="10"/>
                        <text x="12" y="16.2" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor" stroke="none">18+</text>
                    </svg>
                    <span data-i18n="start">Начать Чат</span>
                </a>
            </div>

            <!-- Баннер Telegram -->
            <div class="banner">
                <img src="https://i.postimg.cc/ZqM6rXg1/video-2026-07-17-15-53-28-2.gif" alt="Telegram">
                <a href="https://t.me/+gDTbMlMhkL1kMDVi" class="banner-btn btn-tg" id="btnTg" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                    <span data-i18n="telegram">Telegram</span>
                </a>
            </div>

        </div>
    </div>

    <script>
        // ===== Автоматическое определение языка =====
        const translations = {
            ru: {
                start: "Начать Чат",
                telegram: "Telegram"
            },
            en: {
                start: "Start Chat",
                telegram: "Telegram"
            }
        };

        const userLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        const lang = userLang.startsWith("ru") ? "ru" : "en";

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        document.documentElement.lang = lang;

        // ===== Задержка кнопок баннеров =====
        setTimeout(() => {
            document.getElementById("btn18").classList.add("active");
            document.getElementById("btnTg").classList.add("active");
        }, 1200);

        // Защита от зума на iOS
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
